<style>
  :root{
    --bg:#000000;
    --card:#1c1c1e;
    --card2:#232325;
    --search:#1c1c1e;
    --pill:#232325;
    --yellow:#f5a623;
    --text:#ffffff;
    --sub:#8e8e93;
    --sep:#2c2c2e;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none;
    user-select:none;
  }
  #app{position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden; background:var(--bg);}
  .screen{position:absolute; inset:0; display:flex; flex-direction:column; background:var(--bg); transform:translateX(0); transition:transform .28s ease;}
  .screen.hidden{display:none;}

  /* ---------- LIST SCREEN ---------- */
  #screen-list{padding-top:env(safe-area-inset-top,10px);}
  .tabs{display:flex; justify-content:center; align-items:center; gap:38px; padding:10px 0 14px;}
  .tab-btn{width:46px; height:46px; border-radius:14px; display:flex; align-items:center; justify-content:center; background:none; border:none;}
  .tab-btn.active{background:var(--yellow);}
  .tab-btn svg{width:22px; height:22px;}
  .tab-btn.active svg{stroke:#000;}
  .tab-btn:not(.active) svg{stroke:#aaa;}

  .search-wrap{padding:0 16px 12px;}
  .search-bar{background:var(--search); border-radius:20px; height:42px; display:flex; align-items:center; padding:0 14px; color:var(--sub); font-size:15px; gap:8px;}
  .search-bar input{background:none; border:none; outline:none; color:var(--text); font-size:15px; width:100%; font-family:inherit;}
  .search-bar input::placeholder{color:var(--sub);}

  .filters{display:flex; gap:10px; padding:0 16px 14px;}
  .pill{background:var(--pill); color:var(--text); border-radius:16px; padding:8px 16px; font-size:14px; display:flex; align-items:center; gap:6px;}
  .pill.folder svg{stroke:var(--yellow); fill:none;}

  .list-scroll{flex:1; overflow-y:auto; padding:0 16px 100px; -webkit-overflow-scrolling:touch;}
  .note-card{background:var(--card); border-radius:18px; padding:16px 18px; margin-bottom:12px; display:flex; flex-direction:column; gap:5px; animation:fadein .25s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
  .note-title{font-size:19px; font-weight:600; color:#fff;}
  .note-preview{font-size:14.5px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .note-date{font-size:13px; color:var(--sub); margin-top:2px;}
  .empty-hint{color:var(--sub); text-align:center; margin-top:60px; font-size:15px; line-height:1.5; padding:0 30px;}

  .fab{position:fixed; right:22px; bottom:34px; width:60px; height:60px; border-radius:50%; background:var(--yellow); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 14px rgba(0,0,0,.5); border:none;}
  .fab svg{width:26px; height:26px; stroke:#000;}

  /* ---------- EDITOR SCREEN (text) ---------- */
  #screen-editor{background:#000;}
  .editor-topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 14px 6px; padding-top:calc(env(safe-area-inset-top,10px) + 6px);}
  .icon-btn{width:38px; height:38px; display:flex; align-items:center; justify-content:center; background:none; border:none;}
  .icon-btn svg{width:22px; height:22px; stroke:#e5e5e7; fill:none;}
  .icon-btn.disabled svg{stroke:#4a4a4c;}
  .topbar-right{display:flex; gap:6px;}

  .title-input{background:none; border:none; outline:none; color:#fff; font-size:26px; font-weight:600; padding:8px 18px 0; font-family:inherit;}
  .title-input::placeholder{color:#5c5c5e;}
  .meta-row{display:flex; gap:8px; padding:6px 18px 10px; color:var(--sub); font-size:13.5px; align-items:center;}
  .meta-sep{width:1px; height:12px; background:var(--sep);}

  .content-area{flex:1; border:none; outline:none; background:none; color:#fff; font-size:17px; line-height:1.5; padding:0 18px; resize:none; font-family:inherit; width:100%;}
  .content-area::placeholder{color:#5c5c5e;}

  .toolbar{border-top:1px solid var(--sep);}
  .toolbar-row1{display:flex; justify-content:space-between; padding:12px 16px; align-items:center;}
  .toolbar-row1 .icon-btn svg{width:21px; height:21px;}
  .toolbar-row1 .icon-btn.on{background:var(--yellow); border-radius:10px;}
  .toolbar-row1 .icon-btn.on svg{stroke:#000;}
  .toolbar-row2{display:flex; justify-content:space-between; align-items:center; padding:8px 16px 14px; padding-bottom:calc(env(safe-area-inset-bottom,8px) + 10px); background:#141416;}
  .grid-icon{display:grid; grid-template-columns:repeat(2,6px); grid-template-rows:repeat(2,6px); gap:3px;}
  .grid-icon div{width:6px; height:6px; background:#e5e5e7; border-radius:2px;}
  .gif-label{color:#e5e5e7; font-weight:700; font-size:14px; letter-spacing:.5px;}
  .mic-btn{width:36px; height:36px; border-radius:50%; background:#3a3a3c; display:flex; align-items:center; justify-content:center;}
  .mic-btn svg{width:17px; height:17px; stroke:#e5e5e7;}

  /* ---------- DRAW SCREEN ---------- */
  #screen-draw{background:#fff;}
  .draw-topbar{display:flex; align-items:center; justify-content:space-between; padding:14px 16px; padding-top:calc(env(safe-area-inset-top,10px) + 10px); background:#fff;}
  .draw-topbar .icon-btn svg{stroke:#1c1c1e;}
  .draw-topbar .icon-btn.disabled svg{stroke:#c8c8ca;}
  .draw-left{display:flex; gap:6px;}
  .draw-right{display:flex; gap:14px; align-items:center;}
  .check-btn{width:38px; height:38px; display:flex; align-items:center; justify-content:center;}
  .check-btn svg{width:24px; height:24px; stroke:#1c1c1e; stroke-width:2.4;}

  .canvas-wrap{flex:1; position:relative; overflow:hidden;
    background-image:radial-gradient(circle, #d8d8da 1px, transparent 1px);
    background-size:22px 22px; background-position:10px 10px;
  }
  #drawCanvas{position:absolute; inset:0; width:100%; height:100%; touch-action:none;}

  .pen-tray{display:flex; align-items:center; gap:14px; padding:14px 16px; padding-bottom:calc(env(safe-area-inset-bottom,10px) + 14px); background:#fff; border-top:1px solid #eee; overflow-x:auto;}
  .pen-item{flex:0 0 auto; width:40px; height:52px; border-radius:10px; display:flex; align-items:center; justify-content:center; position:relative;}
  .pen-item.active{background:#f0f0f2;}
  .color-dot{width:26px; height:26px; border-radius:50%; background:#111; border:2px solid #ddd;}
  .pen-icon{width:26px; height:38px;}
  .pen-item .badge{position:absolute; bottom:2px; width:8px; height:8px; border-radius:50%;}

  /* Toast for the reveal moment (subtle) */
  .status-dot{position:fixed; top:8px; left:50%; transform:translateX(-50%); width:6px; height:6px; border-radius:50%; background:#3a3a3c; opacity:0; transition:opacity .4s;}
  .status-dot.live{opacity:1; background:var(--yellow);}
</style>

</div>
<div class="status-dot" id="statusDot"></div>

<script>
(function(){
  const IT_MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  const cap = s => s.charAt(0).toUpperCase()+s.slice(1);

  function fmtListDate(iso){
    const d = new Date(iso), now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const yest = new Date(now); yest.setDate(now.getDate()-1);
    const isYest = d.toDateString() === yest.toDateString();
    const hm = d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
    if(sameDay) return 'Oggi '+hm;
    if(isYest) return 'Ieri '+hm;
    return d.getDate()+' '+cap(IT_MONTHS[d.getMonth()]);
  }
  function fmtMetaDate(iso){
    const d = new Date(iso);
    const hm = d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0');
    return d.getDate()+' '+IT_MONTHS[d.getMonth()]+'  '+hm;
  }

  const BLOB_URL = 'https://jsonblob.com/api/jsonBlob/01a00aa3-95ce-7cd5-a465-af29d0de265f';
  let notes = [];
  let currentId = null;
  let dirtyUntil = 0; // timestamp until which we ignore remote overwrites for currentId
  let drawTool = 'pencil';
  let strokes = [];      // current session strokes for undo/redo
  let undone = [];
  let bgImage = null;    // Image object of previously-synced drawing
  let drawing = false;
  let lastPoint = null;

  const el = id => document.getElementById(id);
  const listScroll = el('listScroll');
  const screens = {list: el('screen-list'), editor: el('screen-editor'), draw: el('screen-draw')};

  function show(name){
    Object.values(screens).forEach(s=>s.classList.add('hidden'));
    screens[name].classList.remove('hidden');
    el('fabNew').style.display = name==='list' ? 'flex' : 'none';
  }

  function seedDefaults(){
    const now = Date.now();
    notes = [
      {id:'n1', title:'Lista spesa', type:'text', content:'Pane\nUova\nCaffè', date:new Date(now-2*86400000).toISOString(), updatedAt:now-2*86400000},
      {id:'n2', title:'Idee regalo', type:'text', content:'...', date:new Date(now-6*86400000).toISOString(), updatedAt:now-6*86400000},
      {id:'n3', title:'Numero idraulico', type:'text', content:'347 22xxxxx', date:new Date(now-20*86400000).toISOString(), updatedAt:now-20*86400000},
    ];
  }

  async function loadNotes(){
    try{
      const res = await fetch(BLOB_URL, {headers:{'Accept':'application/json'}});
      if(res.ok){
        const data = await res.json();
        notes = Array.isArray(data) ? data : [];
      } else {
        notes = [];
      }
      if(!notes.length) { seedDefaults(); await persist(); }
    }catch(e){
      seedDefaults();
      await persist();
    }
    renderList();
  }

  async function persist(){
    try{
      await fetch(BLOB_URL, {
        method:'PUT',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body: JSON.stringify(notes)
      });
    }catch(e){ /* offline or blocked - will retry on next save/poll */ }
  }

  function previewOf(n){
    if(n.type==='draw') return n.content ? 'Disegno' : '...';
    const first = (n.content||'').split('\n').find(l=>l.trim().length) || '';
    return first.trim() ? first.trim() : '...';
  }

  function renderList(filter){
    const q = (filter||'').trim().toLowerCase();
    const sorted = [...notes].sort((a,b)=>b.updatedAt-a.updatedAt);
    const visible = q ? sorted.filter(n => (n.title||'').toLowerCase().includes(q) || (n.content||'').toLowerCase().includes(q)) : sorted;
    listScroll.innerHTML = '';
    if(!visible.length){
      const div = document.createElement('div');
      div.className='empty-hint';
      div.textContent = q ? 'Nessuna nota trovata' : 'Nessuna nota. Tocca + per crearne una.';
      listScroll.appendChild(div);
      return;
    }
    visible.forEach(n=>{
      const card = document.createElement('div');
      card.className = 'note-card';
      card.innerHTML = `<div class="note-title">${escapeHtml(n.title||'Senza titolo')}</div>
        <div class="note-preview">${escapeHtml(previewOf(n))}</div>
        <div class="note-date">${fmtListDate(n.updatedAt)}</div>`;
      card.addEventListener('click', ()=>openNote(n.id));
      listScroll.appendChild(card);
    });
  }
  function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

  function openNote(id){
    currentId = id;
    const n = notes.find(x=>x.id===id);
    if(n.type==='draw'){ enterDraw(n); }
    else { enterEditor(n); }
  }

  function enterEditor(n){
    el('titleInput').value = n.title || '';
    el('contentArea').value = n.content || '';
    el('metaDate').textContent = fmtMetaDate(n.date);
    el('metaChars').textContent = (n.content||'').length + ' caratteri';
    show('editor');
    setTimeout(()=>el('contentArea').focus(), 50);
  }

  el('fabNew').addEventListener('click', async ()=>{
    const now = Date.now();
    const n = {id:'n'+now+Math.random().toString(36).slice(2,6), title:'', type:'text', content:'', date:new Date(now).toISOString(), updatedAt:now};
    notes.push(n);
    currentId = n.id;
    await persist();
    enterEditor(n);
  });

  function currentNote(){ return notes.find(n=>n.id===currentId); }

  function markDirty(){ dirtyUntil = Date.now() + 1400; }

  let saveTimer=null;
  function scheduleSaveText(){
    markDirty();
    const n = currentNote(); if(!n) return;
    n.title = el('titleInput').value;
    n.content = el('contentArea').value;
    n.updatedAt = Date.now();
    el('metaChars').textContent = n.content.length + ' caratteri';
    clearTimeout(saveTimer);
    saveTimer = setTimeout(async ()=>{ await persist(); }, 700);
  }
  el('titleInput').addEventListener('input', scheduleSaveText);
  el('contentArea').addEventListener('input', scheduleSaveText);

  el('backBtn').addEventListener('click', async ()=>{
    const n = currentNote();
    if(n){
      n.title = el('titleInput').value;
      n.content = el('contentArea').value;
      n.updatedAt = Date.now();
      if(!n.title.trim() && !n.content.trim() && n.type==='text'){
        notes = notes.filter(x=>x.id!==n.id);
      }
    }
    currentId = null;
    await persist();
    renderList(el('searchInput').value);
    show('list');
  });

  el('searchInput').addEventListener('input', e=>renderList(e.target.value));

  /* ---------------- DRAW MODE ---------------- */
  const canvas = el('drawCanvas');
  const ctx = canvas.getContext('2d');

  function sizeCanvas(){
    const wrap = canvas.parentElement;
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width * devicePixelRatio;
    canvas.height = rect.height * devicePixelRatio;
    canvas.style.width = rect.width+'px';
    canvas.style.height = rect.height+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    redrawAll();
  }

  function redrawAll(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    if(bgImage){
      ctx.drawImage(bgImage, 0, 0, canvas.width/devicePixelRatio, canvas.height/devicePixelRatio);
    }
    strokes.forEach(drawStroke);
  }

  function drawStroke(s){
    if(s.points.length<2){
      if(s.points.length===1){
        ctx.save();
        ctx.globalCompositeOperation = s.tool==='eraser' ? 'destination-out' : 'source-over';
        ctx.fillStyle = '#1c1c1e';
        ctx.beginPath();
        ctx.arc(s.points[0].x, s.points[0].y, s.width/2, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      return;
    }
    ctx.save();
    ctx.globalCompositeOperation = s.tool==='eraser' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = '#1c1c1e';
    ctx.lineWidth = s.width;
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(s.points[0].x, s.points[0].y);
    for(let i=1;i<s.points.length;i++) ctx.lineTo(s.points[i].x, s.points[i].y);
    ctx.stroke();
    ctx.restore();
  }

  function ptFromEvent(e){
    const r = canvas.getBoundingClientRect();
    return {x:e.clientX-r.left, y:e.clientY-r.top};
  }

  canvas.addEventListener('pointerdown', e=>{
    if(drawTool!=='pencil' && drawTool!=='eraser') return;
    drawing = true;
    markDirty();
    const p = ptFromEvent(e);
    const s = {tool:drawTool, width: drawTool==='eraser'?22:3, points:[p]};
    strokes.push(s); undone=[];
    lastPoint = p;
    redrawAll();
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e=>{
    if(!drawing) return;
    const p = ptFromEvent(e);
    const s = strokes[strokes.length-1];
    s.points.push(p);
    drawStroke(s.points.length===2 ? s : {tool:s.tool, width:s.width, points:[lastPoint,p]});
    lastPoint = p;
  });
  function endStroke(){
    if(!drawing) return;
    drawing = false;
    scheduleDrawSave();
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  let drawSaveTimer=null;
  function scheduleDrawSave(){
    clearTimeout(drawSaveTimer);
    drawSaveTimer = setTimeout(async ()=>{
      const n = currentNote(); if(!n) return;
      n.content = canvas.toDataURL('image/png');
      n.type='draw';
      n.updatedAt = Date.now();
      await persist();
    }, 600);
  }

  function setTool(t){
    drawTool = t;
    ['tool-pencil','tool-brush','tool-hl','tool-fp','tool-eraser'].forEach(id=>el(id).classList.remove('active'));
    if(t==='pencil') el('tool-pencil').classList.add('active');
    if(t==='eraser') el('tool-eraser').classList.add('active');
  }
  el('tool-pencil').addEventListener('click', ()=>setTool('pencil'));
  el('tool-eraser').addEventListener('click', ()=>setTool('eraser'));
  // fake tools: just flash selection, still draw with pencil behavior
  ['tool-dot','tool-brush','tool-hl','tool-fp'].forEach(id=>{
    el(id).addEventListener('click', ()=>{ setTool('pencil'); });
  });

  el('undoBtn').addEventListener('click', ()=>{
    if(!strokes.length) return;
    undone.push(strokes.pop());
    redrawAll();
    scheduleDrawSave();
  });
  el('redoBtn').addEventListener('click', ()=>{
    if(!undone.length) return;
    strokes.push(undone.pop());
    redrawAll();
    scheduleDrawSave();
  });

  el('toScribble').addEventListener('click', ()=>{
    const n = currentNote(); if(!n) return;
    n.title = el('titleInput').value;
    n.updatedAt = Date.now();
    enterDraw(n);
  });

  function enterDraw(n){
    n.type='draw';
    strokes=[]; undone=[]; bgImage=null;
    show('draw');
    setTimeout(()=>{
      sizeCanvas();
      if(n.content){
        const img = new Image();
        img.onload = ()=>{ bgImage = img; redrawAll(); };
        img.src = n.content;
      }
    }, 30);
  }

  el('drawDone').addEventListener('click', async ()=>{
    const n = currentNote();
    if(n){
      n.content = canvas.toDataURL('image/png');
      n.updatedAt = Date.now();
      const blank = strokes.length===0 && !bgImage;
      if(blank && !n.title.trim()){ notes = notes.filter(x=>x.id!==n.id); }
      await persist();
    }
    currentId = null;
    renderList(el('searchInput').value);
    show('list');
  });

  window.addEventListener('resize', ()=>{ if(!screens.draw.classList.contains('hidden')) sizeCanvas(); });

  /* ---------------- SYNC POLLING ---------------- */
  async function poll(){
    try{
      const res = await fetch(BLOB_URL, {headers:{'Accept':'application/json'}});
      if(!res.ok) return;
      const remote = await res.json();
      if(!Array.isArray(remote)) return;
      const remoteMap = {}; remote.forEach(n=>remoteMap[n.id]=n);
      const localMap = {}; notes.forEach(n=>localMap[n.id]=n);

      const editingLocally = currentId && Date.now() < dirtyUntil;

      let changed = false;
      // merge remote into local
      remote.forEach(rn=>{
        const ln = localMap[rn.id];
        if(!ln){ notes.push(rn); changed=true; return; }
        if(rn.id===currentId && editingLocally) return; // don't clobber active local edits
        if(rn.updatedAt > ln.updatedAt){
          Object.assign(ln, rn);
          changed = true;
        }
      });
      // remove notes deleted remotely (only if not the one we're locally holding unsaved)
      notes = notes.filter(ln => remoteMap[ln.id] || ln.id===currentId);

      if(changed){
        if(!currentId){
          renderList(el('searchInput').value);
        } else {
          const n = currentNote();
          if(n && n.id===currentId && !editingLocally){
            if(n.type==='text' && !screens.editor.classList.contains('hidden')){
              if(document.activeElement !== el('contentArea') && document.activeElement !== el('titleInput')){
                el('titleInput').value = n.title||'';
                el('contentArea').value = n.content||'';
                el('metaChars').textContent = (n.content||'').length + ' caratteri';
                el('statusDot').classList.add('live');
                setTimeout(()=>el('statusDot').classList.remove('live'), 900);
              }
            } else if(n.type==='draw' && !screens.draw.classList.contains('hidden')){
              const img = new Image();
              img.onload = ()=>{ bgImage = img; strokes=[]; undone=[]; redrawAll(); };
              img.src = n.content;
              el('statusDot').classList.add('live');
              setTimeout(()=>el('statusDot').classList.remove('live'), 900);
            }
          }
        }
      }
    }catch(e){ /* ignore transient errors */ }
  }
  setInterval(poll, 1800);

  loadNotes();
  show('list');
})();
</script>
</body>
</html>
